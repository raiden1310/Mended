<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F7F5F1" />
    <meta name="description" content="Mended — jewelry repair, reimagined." />
    <title>Mended</title>
    <style>
      html, body { margin: 0; width: 100%; min-height: 100%; background: #F7F5F1; }
      body { min-height: 100svh; display: grid; place-items: center; }
      main { width: min(100vw, 600px); aspect-ratio: 1; }
      #splash { width: 100%; height: 100%; position: relative; }
      #splash > img { width: 100%; height: 100%; object-fit: cover; }
      #splash > svg { position: absolute; inset: 0; }
      .ready > img { visibility: hidden; }
    </style>
  </head>
  <body>
    <main aria-label="Mended">
      <div id="splash" role="img" aria-label="Mended logo">
        <img src="/mended_splash_end-frame_1080x1920.png" alt="" />
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
